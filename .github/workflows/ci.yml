name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: python -m py_compile skills/*/scripts/*.py tools/*.py
      - run: bash -n tools/deploy.sh
      - run: python -m unittest discover -s tests -v
